<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AI</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <header class="toolbar">
      <h1 class="visually-hidden">IntegratedAI</h1>
      <div class="toolbar-main">
        <span id="status-dot" class="dot" title="Disconnected"></span>
        <nav class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-chat" aria-controls="view-chat" aria-selected="true" data-tab="chat" class="active">Chat</button>
          <button type="button" role="tab" id="tab-patches" aria-controls="view-patches" aria-selected="false" tabindex="-1" data-tab="patches">Patches <span id="patch-count" class="badge" hidden></span></button>
          <button type="button" role="tab" id="tab-tasks" class="devtools-only" aria-controls="view-tasks" aria-selected="false" tabindex="-1" data-tab="tasks">Tasks <span id="task-count" class="badge" hidden></span></button>
          <button type="button" role="tab" id="tab-console" aria-controls="view-console" aria-selected="false" tabindex="-1" data-tab="console">Console <span id="error-count" class="badge error" hidden></span></button>
          <button type="button" role="tab" id="tab-memory" aria-controls="view-memory" aria-selected="false" tabindex="-1" data-tab="memory">Memory <span id="memory-count" class="badge" hidden></span></button>
        </nav>
        <span class="spacer"></span>
        <button type="button" id="history-button" class="icon" title="Earlier conversations on this site" aria-label="History"><span class="glyph"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg></span><span class="label">History</span></button>
        <button type="button" id="new-chat" class="icon" title="New conversation for this tab" aria-label="New conversation"><span class="glyph"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></span><span class="label">New</span></button>
        <button type="button" id="server-toggle" class="icon server-only" aria-pressed="false" title="Start the local server" aria-label="Start the local server"><span class="glyph"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v6"/><path d="M4.6 4.2a5 5 0 1 0 6.8 0"/></svg></span><span class="label">Server</span></button>
        <button type="button" id="open-options" class="icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5h7M13 4.5h1M2 11.5h1M7 11.5h7"/><circle cx="11" cy="4.5" r="2"/><circle cx="5" cy="11.5" r="2"/></svg></button>
      </div>
      <div class="toolbar-session" id="session-row" hidden>
        <select id="provider-select" title="AI provider" aria-label="AI provider"></select>
        <select id="model-select" title="Model" aria-label="Model"></select>
        <span class="spacer"></span>
        <span id="cost" class="cost"></span>
      </div>
      <ai-history id="history" hidden></ai-history>
    </header>

    <div id="banner" class="banner" hidden>
      <span id="banner-text"></span>
      <button type="button" id="banner-action" hidden></button>
    </div>

    <main>
      <section id="view-chat" role="tabpanel" aria-labelledby="tab-chat" class="view">
        <div id="card-tip" class="tip card-only" role="note" hidden>
          <span>This is the quick version. For filling in forms, working through pages, saved tasks and more, press
            <kbd>F12</kbd> and open the <strong>AI</strong> tab. Don't see it? Click <strong>»</strong> in the DevTools tab bar.</span>
          <button type="button" id="card-tip-ok">Got it</button>
        </div>
        <ai-chat id="chat" role="log" aria-live="polite" aria-label="Conversation"></ai-chat>
        <form id="composer" autocomplete="off">
          <div class="composer-box">
            <div class="chips">
                <label class="chip" title="Send a short description of the element selected in the Elements panel">
                  <input type="checkbox" id="ctx-selected"> <span id="selected-label">$0 (nothing selected)</span>
                </label>
                <label class="chip" title="Send recent console errors and warnings">
                  <input type="checkbox" id="ctx-console"> Console
                </label>
                <button type="button" id="pick-element" class="chip-button card-only" title="Click an element on the page to ask about it (Esc cancels)">Pick element</button>
                <label class="chip devtools-only" title="Send failed and recent network requests (sensitive headers removed)">
                  <input type="checkbox" id="ctx-network"> Network
                </label>
                <button type="button" id="copy-text" class="chip-button" title="Copy the text of the selected element to the clipboard (no AI involved)">Copy text</button>
            </div>
            <textarea id="prompt" rows="2" placeholder="Ask about this page or the selected element" aria-label="Message"></textarea>
            <div class="composer-bar">
              <button type="button" id="to-devtools" class="link card-only" title="Form filling, page steps, element edits, scripts and the network log are in the DevTools panel">Continue in DevTools</button>
              <select id="agent-mode" class="mode-select devtools-only" aria-label="What the AI may do on the page"
                title="What the AI may do on the page">
                <option value="suggest" title="It suggests changes; nothing happens until you click">Suggest</option>
                <option value="ask" title="It works on the page itself and asks before each step">Ask each step</option>
                <option value="auto" title="It works on the page itself and only asks before risky steps">Auto</option>
                <option value="full" title="It works on the page itself and never asks">Full auto</option>
              </select>
              <span class="spacer"></span>
              <button type="submit" id="send" class="send" title="Send (Enter)" aria-label="Send">
                <svg class="i-send" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
                <svg class="i-stop" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1"/></svg>
              </button>
            </div>
          </div>
          <div class="composer-hint">Enter to send · Shift+Enter for a new line</div>
        </form>
      </section>

      <section id="view-patches" role="tabpanel" aria-labelledby="tab-patches" class="view" hidden>
        <ai-patches id="patches"></ai-patches>
      </section>

      <section id="view-tasks" role="tabpanel" aria-labelledby="tab-tasks" class="view" hidden>
        <ai-tasks id="tasks"></ai-tasks>
      </section>

      <section id="view-console" role="tabpanel" aria-labelledby="tab-console" class="view" hidden>
        <ai-console id="console"></ai-console>
      </section>

      <section id="view-memory" role="tabpanel" aria-labelledby="tab-memory" class="view" hidden>
        <ai-memory id="memory"></ai-memory>
      </section>
    </main>

    <script src="panel.js" type="module"></script>
  </body>
</html>
