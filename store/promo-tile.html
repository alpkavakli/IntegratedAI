<!doctype html>
<!-- Chrome Web Store small promo tile (440×280). Rendered by scripts/store-screenshots.mjs ("promo-tile"). -->
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 440px; height: 280px; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 85% 15%, #2a4f8f 0%, #0f1b2d 60%); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 34px; }
  .top { display: flex; align-items: center; gap: 14px; }
  img { width: 56px; height: 56px; }
  h1 { margin: 0; font-size: 28px; line-height: 1.1; letter-spacing: .2px; }
  h1 span { display: block; font-size: 15px; font-weight: 500; color: #9cc0ff; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }
  p { margin: 20px 0 0; font-size: 18px; line-height: 1.4; color: #dbe6ff; }
  .tabs { display: flex; gap: 6px; margin-top: 22px; font-size: 12px; color: #9aa0a6; }
  .tabs span { padding: 3px 8px; border-radius: 4px; background: rgba(255,255,255,.06); }
  .tabs .ai { background: #8ab4f8; color: #0f1b2d; font-weight: 700; }
</style></head>
<body>
  <div class="top">
    <img src="../extension/icons/icon128.png" alt="">
    <h1>IntegratedAI<span>for Chrome DevTools</span></h1>
  </div>
  <p>Ask about any element. Preview the fix. Apply it in one click.</p>
  <div class="tabs"><span>Elements</span><span>Console</span><span>Network</span><span class="ai">AI</span></div>
</body></html>
